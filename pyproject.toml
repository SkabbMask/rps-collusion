[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rps-collusion-colav"
version = "0.1.0"
description = "RPS collusion simulator with calibrated graph and ML coalition detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "networkx>=3.3,<4"]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8,<4", "scikit-learn>=1.3,<2"]
information = ["scipy>=1.11,<2"]

[project.scripts]
rps-simulate = "simulate:main"
rps-analyze = "analyze:main"
rps-evaluate = "evaluate:main"
rps-information = "information:main"
rps-experiment = "experiment:main"

[tool.setuptools]
py-modules = ["simulate", "analyze", "evaluate", "information", "experiment"]

[tool.setuptools.packages.find]
include = ["rps*"]
